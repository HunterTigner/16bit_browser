<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>Pixel16</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
    body { display: grid; place-items: center; }
    canvas { display: block; width: min(100vw, 160vh); height: min(100vh, 62.5vw); image-rendering: pixelated; image-rendering: crisp-edges; cursor: url("./pixel16-cursor.svg") 1 1, default; outline: none; }
  </style>
</head>
<body>
  <canvas id="screen" width="320" height="200" tabindex="0" aria-label="Pixel16 WebAssembly computer screen"></canvas>
  <script src="./pixel16-host.js"></script>
</body>
</html>
